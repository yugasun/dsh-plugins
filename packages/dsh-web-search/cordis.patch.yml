# dsh-web-search — bundle patch layer.
# Installing this package (`dsh plugin --profile web add @yugasun/dsh-web-search`) appends
# it to the profile's bundle stack. The web client half is discovered from
# package.json `dsh.client` and does not need its own patch row.
#
# `id` is the Cordis fiber / settings identity (unscoped). `name` is the npm
# specifier Cordis actually imports — it must match package.json "name".
#
# This file must stay a plain insert (id + name only). dshmarket hot-mount
# cannot apply config or expression rows. `apply()` retargets
# `ctx.web.searchProviderId` / `fetchProviderId` via pinWebSeams.
- insert:
    - id: dsh-web-search
      name: '@yugasun/dsh-web-search'
